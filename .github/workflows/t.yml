name: t
on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:
permissions:
  issues: write
jobs:
  prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          S: ${{ secrets.PROD_SECRET }}
        run: gh issue comment 5 -R $GITHUB_REPOSITORY -b "prod job ran on $GITHUB_REF type=$GITHUB_REF_TYPE secret=[$S]"
  nogate:
    runs-on: ubuntu-latest
    environment: nogate
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          S: ${{ secrets.NG_SECRET }}
        run: gh issue comment 5 -R $GITHUB_REPOSITORY -b "nogate job ran on $GITHUB_REF type=$GITHUB_REF_TYPE secret=[$S]"
