name: t
on:
  push:
    branches: [wf-test]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  merge-with-job-token:
    runs-on: ubuntu-latest
    steps:
      - name: probes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          exec > out.txt 2>&1
          for pr in 53 54 55; do
            echo "== PR $pr: $(gh api repos/$GITHUB_REPOSITORY/pulls/$pr -q '[.title,.changed_files,.mergeable_state]|@tsv')"
            gh api -X PUT repos/$GITHUB_REPOSITORY/pulls/$pr/merge -f merge_method=merge 2>&1 | head -c 400; echo
          done
          echo "== workflow files on wfbase"; gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=wfbase" -q '.[].name' 2>&1 | head
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; cat out.txt; echo '```'; } > body.md
          gh issue comment 5 -R $GITHUB_REPOSITORY -F body.md
